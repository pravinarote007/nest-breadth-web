# Streamlit Cloud / local config for the NIFTY F&O Breadth dashboard.

[server]
headless = true
runOnSave = true
maxUploadSize = 5
enableCORS = false

[client]
# Hide Streamlit Cloud's top-right toolbar (Fork on GitHub / View
# on GitHub / Manage app icons). "viewer" leaves only the small
# hamburger menu; "minimal" hides everything except status spinner.
toolbarMode = "viewer"

[theme]
base = "dark"
primaryColor = "#22C55E"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#1A1F2E"
textColor = "#F0F0F0"
font = "sans serif"

[browser]
gatherUsageStats = false
